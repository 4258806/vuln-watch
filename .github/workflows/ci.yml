name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查
        run: |
          python3 -m py_compile vuln-watch.py test_vuln_watch.py
          bash -n install.sh
          bash -n uninstall.sh
      - name: 单元测试
        run: python3 -m unittest test_vuln_watch -v
